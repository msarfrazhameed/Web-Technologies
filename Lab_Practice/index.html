#Hero {
  background-color: #fcfcfc;
  background-image: url('majestic_fashions_banner.png');
  background-size: cover;
  background-position: center 25%; /* Keeps the models' faces perfectly in view */
  background-repeat: no-repeat;
  text-align: center;
  padding: 60px 20px;
  min-height: 450px; /* Forces a stable widescreen banner height */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#Hero h1, #Hero p {
  color: #ffffff; /* Changes text to white */
  text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.7); /* Adds contrast behind the letters */
}

   #Hero h2{
    color: #ffffff;
    text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.7); /* Adds contrast behind the letters */

    font-size: 36px;
    margin-bottom: 20px;
    font-family: serif;
}
#Hero p{
    font-size: 18px;
    margin-bottom: 30px;
    font-family: sans-serif;
}

#Hero button{
    background-color: black;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}
#Hero button:hover{
    background-color: #333333;
}

</style>
